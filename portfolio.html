<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — OJO Studio</title>
  <meta name="description" content="Projetos OJO Studio — identidades, experiências e histórias para marcas que querem ser sentidas.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #0B0A09;
      color: #F0EEE9;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* NAV */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(1.5rem, 4vw, 4rem);
      height: 60px;
      mix-blend-mode: difference;
    }
    .nav__logo {
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #F0EEE9;
      text-decoration: none;
    }
    .nav__links { display: flex; gap: 2.5rem; }
    .nav__link {
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      color: #F0EEE9;
      text-decoration: none;
      text-transform: uppercase;
      opacity: 0.6;
      transition: opacity 200ms;
    }
    .nav__link:hover, .nav__link--active { opacity: 1; }

    /* PAGE HEADER */
    .pf-header {
      padding: 140px clamp(1.5rem, 4vw, 4rem) 60px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-bottom: 1px solid rgba(240,238,233,0.08);
    }
    .pf-header__title {
      font-family: "Gloock", Georgia, serif;
      font-size: clamp(3rem, 7vw, 7rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .pf-header__count {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.6875rem;
      color: rgba(240,238,233,0.4);
      letter-spacing: 0.04em;
      padding-bottom: 0.5rem;
    }

    /* FILTERS */
    .pf-filters {
      display: flex;
      gap: 0.5rem;
      padding: 1.5rem clamp(1.5rem, 4vw, 4rem);
      border-bottom: 1px solid rgba(240,238,233,0.08);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .pf-filters::-webkit-scrollbar { display: none; }
    .pf-filter {
      flex-shrink: 0;
      padding: 0.4rem 1rem;
      border: 1px solid rgba(240,238,233,0.15);
      border-radius: 999px;
      font-size: 0.6875rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(240,238,233,0.5);
      background: transparent;
      cursor: pointer;
      transition: all 200ms;
    }
    .pf-filter:hover { border-color: rgba(240,238,233,0.4); color: rgba(240,238,233,0.8); }
    .pf-filter--active { background: #F0EEE9; border-color: #F0EEE9; color: #0B0A09; }

    /* PROJECT LIST */
    .pf-list { list-style: none; }

    /* PROJECT ITEM */
    .pf-item {
      position: relative;
      height: 82vh;
      min-height: 480px;
      overflow: hidden;
      border-bottom: 1px solid rgba(240,238,233,0.06);
    }
    .pf-item__link {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      color: inherit;
    }

    /* Image parallax */
    .pf-item__img {
      position: absolute;
      inset: -15% 0;
      width: 100%;
      height: 130%;
      object-fit: cover;
      object-position: center;
      will-change: transform;
    }
    .pf-item:hover .pf-item__img {
      transition: transform 700ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: scale(1.04) translateY(var(--py, 0px)) !important;
    }

    .pf-item__bg-fallback {
      position: absolute;
      inset: 0;
      background: #131210;
    }

    /* Overlay */
    .pf-item__overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(11,10,9,0.92) 0%, rgba(11,10,9,0.35) 50%, rgba(11,10,9,0.08) 100%),
        linear-gradient(to right, rgba(11,10,9,0.25) 0%, transparent 60%);
    }

    /* Content */
    .pf-item__body {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(1.5rem, 3vw, 3rem) clamp(1.5rem, 4vw, 4rem);
    }
    .pf-item__number {
      position: absolute;
      top: clamp(1.5rem, 3vw, 3rem);
      right: clamp(1.5rem, 4vw, 4rem);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.6875rem;
      color: rgba(240,238,233,0.25);
      letter-spacing: 0.08em;
    }
    .pf-item__cat {
      font-size: 0.6875rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(240,238,233,0.45);
      margin-bottom: 0.6rem;
      transform: translateY(10px);
      opacity: 0;
      transition: transform 500ms 50ms cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 500ms 50ms;
    }
    .pf-item__title {
      font-family: "Gloock", Georgia, serif;
      font-size: clamp(2rem, 5vw, 5.5rem);
      font-weight: 400;
      line-height: 1.0;
      letter-spacing: -0.02em;
      max-width: 70%;
      transform: translateY(14px);
      opacity: 0;
      transition: transform 500ms cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 500ms;
    }
    .pf-item__client {
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: rgba(240,238,233,0.4);
      letter-spacing: 0.03em;
      transform: translateY(8px);
      opacity: 0;
      transition: transform 500ms 100ms cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 500ms 100ms;
    }

    /* Reveal on scroll */
    .pf-item.is-visible .pf-item__cat,
    .pf-item.is-visible .pf-item__title,
    .pf-item.is-visible .pf-item__client {
      transform: translateY(0);
      opacity: 1;
    }

    /* Arrow */
    .pf-item__arrow {
      position: absolute;
      bottom: clamp(1.5rem, 3vw, 3rem);
      right: clamp(1.5rem, 4vw, 4rem);
      width: 48px;
      height: 48px;
      border: 1px solid rgba(240,238,233,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 300ms, transform 300ms;
    }
    .pf-item:hover .pf-item__arrow {
      opacity: 1;
      transform: scale(1);
    }

    /* Placeholder shimmer */
    .pf-item--ph .pf-item__bg-fallback {
      background: linear-gradient(90deg, #131210 25%, #1a1917 50%, #131210 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Empty */
    .pf-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60vh;
      color: rgba(240,238,233,0.3);
      font-size: 0.875rem;
    }

    /* FOOTER */
    .pf-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2rem clamp(1.5rem, 4vw, 4rem);
      border-top: 1px solid rgba(240,238,233,0.08);
    }
    .pf-footer__logo {
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(240,238,233,0.3);
    }
    .pf-footer__copy {
      font-size: 0.6875rem;
      color: rgba(240,238,233,0.2);
      letter-spacing: 0.04em;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .nav__links { display: none; }
      .pf-header { flex-direction: column; align-items: flex-start; gap: 1rem; padding-top: 100px; }
      .pf-item { height: 70vh; min-height: 360px; }
      .pf-item__title { max-width: 90%; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .pf-item__cat, .pf-item__title, .pf-item__client {
        transition: none; opacity: 1; transform: none;
      }
      .pf-item__img { transition: none !important; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a class="nav__logo" href="./">OJO</a>
    <div class="nav__links">
      <a class="nav__link nav__link--active" href="portfolio.html">Portfolio</a>
      <a class="nav__link" href="sobre.html">Sobre</a>
      <a class="nav__link" href="contato.html">Contato</a>
    </div>
  </nav>

  <header class="pf-header">
    <h1 class="pf-header__title">Portfolio</h1>
    <span class="pf-header__count" id="project-count">carregando...</span>
  </header>

  <div class="pf-filters" id="filters-bar">
    <button class="pf-filter pf-filter--active" data-cat="all">Todos</button>
  </div>

  <ul class="pf-list" id="project-list">
    <li class="pf-item pf-item--ph"><div class="pf-item__bg-fallback"></div></li>
    <li class="pf-item pf-item--ph"><div class="pf-item__bg-fallback"></div></li>
    <li class="pf-item pf-item--ph"><div class="pf-item__bg-fallback"></div></li>
  </ul>

  <footer class="pf-footer">
    <span class="pf-footer__logo">OJO</span>
    <span class="pf-footer__copy">© 2024 OJO Studio</span>
  </footer>

  <script type="module">
    import { getProjects } from './assets/js/modules/portfolio.js'

    const lang = localStorage.getItem('ojo-lang') || 'pt'
    const list = document.getElementById('project-list')
    const countEl = document.getElementById('project-count')
    const filtersBar = document.getElementById('filters-bar')

    let allProjects = []
    let activeCategory = 'all'

    try {
      allProjects = await getProjects({ publishedOnly: true, locale: lang })
    } catch(e) {
      console.error('Erro ao carregar projetos:', e)
    }

    if (allProjects.length) {
      buildFilters(allProjects)
      renderProjects(allProjects)
    } else {
      list.innerHTML = `<li class="pf-empty">Nenhum projeto publicado.</li>`
      countEl.textContent = '0 projetos'
    }

    function renderProjects(projects) {
      countEl.textContent = `${projects.length} ${projects.length === 1 ? 'projeto' : 'projetos'}`

      list.innerHTML = projects.map((p, i) => {
        const cat = Array.isArray(p.category) ? p.category[0] : (p.category ?? '')
        const num = String(i + 1).padStart(2, '0')
        return `
          <li class="pf-item" data-index="${i}">
            <a class="pf-item__link" href="portfolio/${p.slug}.html">
              ${p.cover_image
                ? `<img class="pf-item__img" src="${p.cover_image}" alt="${p.title}" loading="${i < 2 ? 'eager' : 'lazy'}">`
                : `<div class="pf-item__bg-fallback"></div>`}
              <div class="pf-item__overlay"></div>
              <div class="pf-item__body">
                <span class="pf-item__number">${num}</span>
                ${cat ? `<span class="pf-item__cat">${cat}</span>` : ''}
                <h2 class="pf-item__title">${p.title}</h2>
                ${p.client ? `<span class="pf-item__client">${p.client}${p.year ? ` · ${p.year}` : ''}</span>` : ''}
              </div>
              <div class="pf-item__arrow">↗</div>
            </a>
          </li>`
      }).join('')

      initObserver()
      initParallax()
    }

    function buildFilters(projects) {
      const cats = [...new Set(
        projects.flatMap(p => Array.isArray(p.category) ? p.category : [p.category]).filter(Boolean)
      )]
      cats.forEach(cat => {
        const btn = document.createElement('button')
        btn.className = 'pf-filter'
        btn.dataset.cat = cat
        btn.textContent = cat
        filtersBar.appendChild(btn)
      })

      filtersBar.addEventListener('click', e => {
        const btn = e.target.closest('.pf-filter')
        if (!btn) return
        activeCategory = btn.dataset.cat
        document.querySelectorAll('.pf-filter').forEach(b =>
          b.classList.toggle('pf-filter--active', b === btn))
        const filtered = activeCategory === 'all'
          ? allProjects
          : allProjects.filter(p => {
              const cats = Array.isArray(p.category) ? p.category : [p.category]
              return cats.includes(activeCategory)
            })
        renderProjects(filtered)
      })
    }

    function initObserver() {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('is-visible') })
      }, { threshold: 0.12 })
      document.querySelectorAll('.pf-item').forEach(el => obs.observe(el))
    }

    function initParallax() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
      const items = [...document.querySelectorAll('.pf-item')]

      function tick() {
        items.forEach(item => {
          const rect = item.getBoundingClientRect()
          const vh = window.innerHeight
          const progress = 1 - (rect.bottom / (vh + rect.height))
          const shift = (progress - 0.5) * 70
          const img = item.querySelector('.pf-item__img')
          if (img) img.style.transform = `translateY(${shift}px)`
        })
      }

      window.addEventListener('scroll', tick, { passive: true })
      tick()
    }
  </script>

</body>
</html>
