<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — OJO Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0B0A09;
      --fg: #F0EEE9;
      --muted: rgba(240,238,233,0.4);
      --dim: rgba(240,238,233,0.12);
      --pad: clamp(1.5rem, 4vw, 4rem);
    }
    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* NAV */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--pad); height: 60px;
      pointer-events: none;
    }
    .nav a { pointer-events: all; }
    .nav__logo { font-size: .875rem; font-weight: 500; letter-spacing: .08em; color: var(--fg); text-decoration: none; mix-blend-mode: difference; }
    .nav__links { display: flex; gap: 2.5rem; mix-blend-mode: difference; }
    .nav__link { font-size: .75rem; letter-spacing: .06em; color: var(--fg); text-decoration: none; text-transform: uppercase; opacity: .6; transition: opacity 200ms; }
    .nav__link:hover, .nav__link--active { opacity: 1; }
    @media (max-width: 600px) { .nav__links { display: none; } }

    /* ════════════════════════════════════════════
       KO STAGE — position: fixed
       Shown/hidden by JS
    ════════════════════════════════════════════ */
    #ko-stage {
      position: fixed; inset: 0; z-index: 20;
      opacity: 0; pointer-events: none;
    }
    #ko-stage.ko-active { opacity: 1; pointer-events: all; }

    /* Full-screen bg image (fades in during phase B) */
    .ko-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0;
    }

    /* SVG knockout art (phase A: image visible through letterforms) */
    .ko-text {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .ko-text svg {
      width: 100%; height: 100%;
    }

    /* Scroll cue */
    .ko-cue {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 5; display: flex; flex-direction: column; align-items: center; gap: .5rem;
      color: var(--fg);
    }
    .ko-cue span { font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; opacity: .4; }
    .ko-cue__arrow { width: 1px; background: rgba(240,238,233,.3); animation: drop 1.6s ease-in-out infinite; }
    @keyframes drop {
      0%,100% { height: 20px; opacity: .3; }
      50%      { height: 36px; opacity: .7; }
    }

    /* Project reveal (phase C) */
    .ko-reveal {
      position: absolute; inset: 0; z-index: 3;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: clamp(2rem,5vw,5rem) var(--pad);
      opacity: 0; pointer-events: none;
    }
    .ko-reveal__eye   { font-size: .6875rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }
    .ko-reveal__title { font-family: "Gloock", Georgia, serif; font-size: clamp(2.5rem,7vw,7rem); font-weight: 400; line-height: 1; letter-spacing: -.02em; max-width: 14ch; }
    .ko-reveal__sub   { margin-top: 1rem; font-size: .75rem; color: var(--muted); display: flex; gap: 1.5rem; }
    .ko-reveal__link  {
      position: absolute; bottom: clamp(2rem,5vw,5rem); right: var(--pad);
      font-size: .75rem; letter-spacing: .06em; text-transform: uppercase;
      color: var(--fg); text-decoration: none;
      border-bottom: 1px solid rgba(240,238,233,.3); padding-bottom: 2px;
    }

    /* ════════════════════════════════════════════
       REEL STAGE — position: fixed
    ════════════════════════════════════════════ */
    #reel-stage {
      position: fixed; inset: 0; z-index: 10;
      opacity: 0; pointer-events: none;
    }
    #reel-stage.reel-active { opacity: 1; pointer-events: all; }

    .reel-bgs { position: absolute; inset: 0; z-index: 0; }
    .reel-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 650ms cubic-bezier(.25,.46,.45,.94);
    }
    .reel-bg.on { opacity: 1; }

    .reel-overlay {
      position: absolute; inset: 0; z-index: 1;
      background:
        linear-gradient(to right, rgba(11,10,9,.88) 28%, rgba(11,10,9,.25) 100%),
        linear-gradient(to top, rgba(11,10,9,.55) 0%, transparent 50%);
    }

    .reel-body {
      position: absolute; inset: 0; z-index: 2;
      display: grid; grid-template-columns: 1fr 1fr;
      align-items: center; padding: 0 var(--pad); gap: 2rem;
    }

    .reel-left { display: flex; flex-direction: column; gap: 2.5rem; }
    .reel-left__label { font-size: .6875rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .reel-left__num   { font-family: "IBM Plex Mono", monospace; font-size: .6875rem; color: var(--muted); letter-spacing: .06em; }
    .reel-left__title { font-family: "Gloock", Georgia, serif; font-size: clamp(1.5rem,3vw,3.2rem); font-weight: 400; line-height: 1.1; letter-spacing: -.02em; max-width: 14ch; }
    .reel-left__sub   { font-size: .75rem; color: var(--muted); display: flex; flex-direction: column; gap: .3rem; margin-top: -1.5rem; }
    .reel-left__link  {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: .75rem; letter-spacing: .06em; text-transform: uppercase;
      color: var(--fg); text-decoration: none;
      border-bottom: 1px solid rgba(240,238,233,.25); padding-bottom: 2px;
      width: fit-content;
    }

    .reel-right {
      height: 100vh; display: flex; flex-direction: column; justify-content: center;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, transparent, black 22%, black 78%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 22%, black 78%, transparent);
    }
    .reel-list { display: flex; flex-direction: column; will-change: transform; }
    .reel-item {
      font-family: "Gloock", Georgia, serif; font-weight: 400;
      line-height: 1.1; letter-spacing: -.025em;
      cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: font-size 350ms cubic-bezier(.25,.46,.45,.94), opacity 300ms, color 300ms;
      padding: .05em 0;
    }
    .reel-item[data-d="0"] { font-size: clamp(2.2rem,5vw,5.5rem); opacity: 1;   color: var(--fg); }
    .reel-item[data-d="1"] { font-size: clamp(1.4rem,2.8vw,3rem);  opacity: .45; color: var(--fg); }
    .reel-item[data-d="2"] { font-size: clamp(1rem,2vw,2rem);       opacity: .22; color: var(--fg); }
    .reel-item[data-d="3"] { font-size: clamp(.8rem,1.5vw,1.5rem);  opacity: .1;  color: var(--fg); }
    .reel-item[data-d="x"] { font-size: clamp(.7rem,1.2vw,1.2rem);  opacity: .05; color: var(--fg); }

    @media (max-width: 700px) {
      .reel-body { grid-template-columns: 1fr; align-items: flex-end; padding-bottom: 5rem; }
      .reel-left { display: none; }
      .reel-right { height: 60vh; }
    }

    /* ════════════ FOOTER ════════════ */
    .pf-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2rem var(--pad); border-top: 1px solid var(--dim);
    }
    .pf-footer__logo { font-size: .875rem; font-weight: 500; letter-spacing: .08em; color: var(--muted); }
    .pf-footer__copy { font-size: .6875rem; color: rgba(240,238,233,.18); letter-spacing: .04em; }

    @media (prefers-reduced-motion: reduce) {
      .ko-cue__arrow, .reel-bg, .reel-item { transition: none !important; animation: none !important; }
    }
  </style>
</head>

        <div>

        </div>
        <a class="reel-left__link" id="rl-link" href="#">Ver projeto</a>

  <footer class="pf-footer" id="pf-footer">
    <span class="pf-footer__logo">OJO</span>

  </footer>

  <script type="module">
    import { getProjects } from './assets/js/modules/portfolio.js'

    const lang = localStorage.getItem('ojo-lang') || 'pt'

    const DEMO = [
      { slug: 'bmw',  title: 'BMW',          client: 'BMW Group',  category: 'Branding',   year: 2024, cover_image: '' },
      { slug: 'ojo',  title: 'OJO Rebrand',  client: 'OJO Studio', category: 'Identidade', year: 2024, cover_image: '' },
      { slug: 'cp1',  title: 'Lançamento',   client: 'Cliente',    category: 'Motion',     year: 2023, cover_image: '' },
      { slug: 'cp2',  title: 'Editorial',    client: 'Magazine',   category: 'Editorial',  year: 2023, cover_image: '' },
    ]

    const GRADS = [
      'linear-gradient(135deg,#2a1a4a,#4a2a7a,#1a2a5a)',
      'linear-gradient(135deg,#0a2a1a,#1a5a2a,#0a3a2a)',
      'linear-gradient(135deg,#4a1010,#7a2a10,#2a1010)',
      'linear-gradient(135deg,#101040,#202070,#102050)',
    ]

    function bgStyle(p, i) {
      return p.cover_image
        ? `background-image:url('${p.cover_image}');background-size:cover;background-position:center`
        : `background:${GRADS[i % GRADS.length]}`
    }

    let projects = []
    try { projects = await getProjects({ publishedOnly: true, locale: lang }) } catch(e) {}
    if (!projects.length) projects = DEMO

    init(projects)

    function init(ps) {
      const first = ps[0]

      // ── KO: set background image in pattern ──
      const koImg  = document.getElementById('ko-img')
      const koBg   = document.getElementById('ko-bg')
      const koEye  = document.getElementById('ko-eye')
      const koTitle = document.getElementById('ko-title')
      const koSub  = document.getElementById('ko-sub')
      const koLink = document.getElementById('ko-link')

      if (first.cover_image) {
        koImg.setAttribute('href', first.cover_image)
      } else {
        // Fallback: use gradient color
        document.getElementById('ko-pat-fallback').setAttribute('fill', GRADS[0].match(/#[0-9a-f]+/gi)?.[1] || '#4a2a7a')
      }
      koBg.style.cssText = bgStyle(first, 0)
      koBg.style.opacity = '0'  // reset (JS controls)

      koEye.textContent   = `01 / ${String(ps.length).padStart(2,'0')}`
      koTitle.textContent = first.title
      koSub.innerHTML     = [first.client, Array.isArray(first.category) ? first.category[0] : first.category].filter(Boolean).map(t=>`<span>${t}</span>`).join('')
      koLink.href         = `portfolio/${first.slug}.html`

      // ── Reel: build bgs + list ──
      const bgsEl  = document.getElementById('reel-bgs')
      const listEl = document.getElementById('reel-list')
      const rlNum  = document.getElementById('rl-num')
      const rlTitle = document.getElementById('rl-title')
      const rlSub  = document.getElementById('rl-sub')
      const rlLink = document.getElementById('rl-link')

      bgsEl.innerHTML  = ps.map((p,i) => `<div class="reel-bg${i===0?' on':''}" style="${bgStyle(p,i)}"></div>`).join('')
      listEl.innerHTML = ps.map((p,i) => `<div class="reel-item" data-i="${i}" data-d="${i < 3 ? i : 'x'}" data-slug="${p.slug}">${p.title}</div>`).join('')

      rlNum.textContent   = `01 / ${String(ps.length).padStart(2,'0')}`
      rlTitle.textContent = first.title
      rlSub.innerHTML     = [first.client, Array.isArray(first.category) ? first.category[0] : first.category].filter(Boolean).map(t=>`<span>${t}</span>`).join('')
      rlLink.href         = `portfolio/${first.slug}.html`

      listEl.addEventListener('click', e => {
        const item = e.target.closest('.reel-item')
        if (item) window.location.href = `portfolio/${item.dataset.slug}.html`
      })

      // ── Set trigger heights ──
      const koTrigger   = document.getElementById('ko-trigger')
      const reelTrigger = document.getElementById('reel-trigger')

      // KO: 100vh of scroll range
      koTrigger.style.height = '100vh'

      // Reel: (N-1)*70vh of animation + 60vh of hold (last project stays visible)
      const reelAnimVh = Math.max(200, (ps.length - 1) * 70)
      const reelHoldVh = 60
      reelTrigger.style.height = `${reelAnimVh + reelHoldVh}vh`

      // ── Scroll engine ──
      const koStage   = document.getElementById('ko-stage')
      const reelStage = document.getElementById('reel-stage')
      const reelBgs   = [...bgsEl.children]
      const reelItems = [...listEl.querySelectorAll('.reel-item')]

      let curActive = -1
      let koWasActive   = null
      let reelWasActive = null

      function clamp(v,a,b) { return v < a ? a : v > b ? b : v }
      function norm(v,a,b)  { return clamp((v-a)/(b-a), 0, 1) }

      function tick() {
        const wy = window.scrollY
        const vh = window.innerHeight

        const koH    = koTrigger.offsetHeight    // 100vh in px
        const rtTop  = reelTrigger.offsetTop     // = koH
        const rtH    = reelTrigger.offsetHeight  // (reelAnimVh+reelHoldVh) in px
        const rtAnimH = rtH - reelHoldVh / 100 * vh  // animation range in px

        const koActive   = wy >= 0 && wy < koH
        const reelActive = wy >= rtTop && wy < rtTop + rtH

        // Show/hide KO (snap: no transition to avoid flash)
        if (koActive !== koWasActive) {
          koStage.style.transition = 'none'
          koStage.classList.toggle('ko-active', koActive)
          koWasActive = koActive
        }

        // Show/hide Reel (fade in, snap out)
        if (reelActive !== reelWasActive) {
          reelStage.style.transition = reelActive ? 'opacity 200ms ease' : 'none'
          reelStage.classList.toggle('reel-active', reelActive)
          reelWasActive = reelActive
        }

        // ── KO animation ──
        if (koActive) {
          const koProg = wy / koH  // 0 → 1

          const phA = norm(koProg, 0,    0.45)
          const phB = norm(koProg, 0.45, 0.78)
          const phC = norm(koProg, 0.78, 1.0)

          // SVG art opacity: fades out as bg image fades in
          const koTextEl = document.getElementById('ko-text')
          koTextEl.style.opacity = String(1 - phB)

          // Pattern parallax: shift the pattern so the image moves
          const pat = document.getElementById('ko-pattern')
          if (pat) pat.setAttribute('patternTransform', `scale(1.04) translate(0, ${-koProg * 30})`)

          koBg.style.opacity   = String(phB)
          koBg.style.transform = `scale(1.06) translateY(${koProg * 20}px)`

          const koCue = document.getElementById('ko-cue')
          koCue.style.opacity  = String(clamp(1 - koProg * 5, 0, 1))

          const koReveal = document.getElementById('ko-reveal')
          koReveal.style.opacity       = String(phC)
          koReveal.style.pointerEvents = phC > 0.5 ? 'all' : 'none'
        }

        // ── Reel animation ──
        if (reelActive) {
          const reelProg = clamp((wy - rtTop) / rtAnimH, 0, 1)
          const rawIdx   = reelProg * (ps.length - 1)
          const newActive = Math.round(rawIdx)

          if (newActive !== curActive) {
            curActive = newActive
            reelBgs.forEach((b,i) => b.classList.toggle('on', i === curActive))
            const p = ps[curActive]
            rlNum.textContent   = `${String(curActive+1).padStart(2,'0')} / ${String(ps.length).padStart(2,'0')}`
            rlTitle.textContent = p.title
            rlSub.innerHTML     = [p.client, Array.isArray(p.category) ? p.category[0] : p.category].filter(Boolean).map(t=>`<span>${t}</span>`).join('')
            rlLink.href         = `portfolio/${p.slug}.html`
          }

          // Update item sizes
          reelItems.forEach((item, i) => {
            const dist = Math.abs(i - rawIdx)
            item.dataset.d = dist < .5 ? '0' : dist < 1.5 ? '1' : dist < 2.5 ? '2' : dist < 3.5 ? '3' : 'x'
          })

          // Center active item vertically
          let offsetPx = 0
          for (let i = 0; i < curActive; i++) {
            offsetPx += reelItems[i].offsetHeight * 1.1
          }
          const stepH = curActive > 0 ? offsetPx / curActive : (reelItems[0] ? reelItems[0].offsetHeight * 1.1 : 80)
          const smoothOffset = rawIdx * stepH
          const activeH = reelItems[curActive] ? reelItems[curActive].offsetHeight : 72
          const centerOffset = vh / 2 - activeH / 2
          listEl.style.transform = `translateY(${centerOffset - smoothOffset}px)`
        }

        requestAnimationFrame(tick)
      }

      requestAnimationFrame(tick)
    }
  </script>

</body>
