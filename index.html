<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJO Studio</title>
  <meta name="description" content="OJO Studio — storyfeeling.">

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>

  <!-- NAV -->
  <nav class="nav" id="nav">
    <a class="nav__logo" href="/">OJO</a>
    <div class="nav__links" id="nav-links">
      <a class="nav__link" href="/portfolio.html">Portfolio</a>
      <a class="nav__link" href="/sobre.html">Sobre</a>
      <a class="nav__link" href="/contato.html">Contato</a>
    </div>
    <div class="nav__lang" id="nav-lang">
      <button class="nav__lang-btn nav__lang-btn--active" onclick="setLang('pt')">PT</button>
      <button class="nav__lang-btn" onclick="setLang('en')">EN</button>
    </div>
    <button class="nav__toggle" id="nav-toggle" aria-label="Menu">
      <span class="nav__toggle-line"></span>
      <span class="nav__toggle-line"></span>
    </button>
  </nav>

  <!-- HOME: placeholder para experiência 3D do Fred -->
  <div class="page-wrap">
    <main class="main">
      <div class="container">
        <section class="hero">
          <p class="hero__eyebrow">OJO Studio</p>
          <h1 class="hero__title">Storyfeeling.</h1>
          <p class="hero__subtitle">
            Identidades, experiências e histórias para marcas que querem ser sentidas.
          </p>
        </section>
      </div>

      <!-- Prévia do portfolio -->
      <section class="section" style="background: var(--color-bg-2)">
        <div class="container">
          <div class="section__header">
            <h2 class="section__title">Trabalhos recentes</h2>
            <a class="btn btn--ghost btn--sm" href="/portfolio.html">Ver todos</a>
          </div>
          <div class="portfolio-grid" id="home-projects">
            <!-- Preenchido via JS -->
            <div class="project-card">
              <div class="project-card__image-placeholder">Carregando...</div>
            </div>
            <div class="project-card">
              <div class="project-card__image-placeholder">Carregando...</div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer container">
      <div class="footer__logo">OJO Studio</div>
      <div class="footer__copy">© 2024 OJO Studio. Todos os direitos reservados.</div>
      <div class="footer__links">
        <a class="footer__link" href="https://instagram.com/ojostudio" target="_blank" rel="noopener">Instagram</a>
        <a class="footer__link" href="/contato.html">Contato</a>
      </div>
    </footer>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <script type="module">
    import { getFeaturedProjects } from './assets/js/modules/portfolio.js'
    import { initScrollNav, initTheme, setLang as _setLang, getLang } from './assets/js/modules/ui.js'

    initTheme()
    initScrollNav()

    // Mobile nav toggle
    document.getElementById('nav-toggle').addEventListener('click', () => {
      document.getElementById('nav').classList.toggle('nav--open')
    })

    // Lang
    window.setLang = _setLang
    const lang = getLang()
    document.documentElement.lang = lang
    document.querySelectorAll('.nav__lang-btn').forEach((btn, i) => {
      btn.classList.toggle('nav__lang-btn--active', (i === 0 && lang === 'pt') || (i === 1 && lang === 'en'))
    })

    // Carrega projetos em destaque
    try {
      const projects = await getFeaturedProjects(2, lang)
      const grid = document.getElementById('home-projects')

      if (projects.length === 0) {
        grid.innerHTML = '<p class="empty-state__description" style="grid-column:span 2">Nenhum projeto publicado.</p>'
        return
      }

      grid.innerHTML = projects.map(p => `
        <a class="project-card" href="/portfolio/${p.slug}.html">
          ${p.cover_image
            ? `<img class="project-card__image" src="${p.cover_image}" alt="${p.title}" loading="lazy">`
            : `<div class="project-card__image-placeholder">${p.title}</div>`}
          <div class="project-card__body">
            <div class="project-card__cat">${Array.isArray(p.category) ? p.category.join(' · ') : p.category ?? ''}</div>
            <div class="project-card__title">${p.title}</div>
            <div class="project-card__client">${p.client ?? ''}</div>
          </div>
        </a>
      `).join('')
    } catch (err) {
      console.error('Erro ao carregar projetos:', err)
    }
  </script>

</body>
</html>
