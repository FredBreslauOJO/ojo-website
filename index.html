<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJO Studio</title>
  <meta name="description" content="OJO Studio — storyfeeling.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>

  <nav class="nav" id="nav">
    <a class="nav__logo" href="./">OJO</a>
    <div class="nav__links" id="nav-links">
      <a class="nav__link" href="portfolio.html">Portfolio</a>
      <a class="nav__link" href="sobre.html">Sobre</a>
      <a class="nav__link" href="contato.html">Contato</a>
    </div>
    <div class="nav__lang" id="nav-lang">
      <button class="nav__lang-btn nav__lang-btn--active" onclick="setLang('pt')">PT</button>
      <button class="nav__lang-btn" onclick="setLang('en')">EN</button>
    </div>
    <button class="nav__toggle" id="nav-toggle" aria-label="Menu">
      <span class="nav__toggle-line"></span>
      <span class="nav__toggle-line"></span>
    </button>
  </nav>

  <div class="page-wrap">
    <main class="main">

      <!-- HERO — vídeo do manequim -->
      <section class="hero-video">
        <video class="hero-video__bg" autoplay loop muted playsinline>
          <source src="assets/mannequin-loop.webm" type="video/webm">
          <source src="assets/mannequin-loop.mp4"  type="video/mp4">
        </video>
        <div class="hero-video__overlay"></div>
        <div class="hero-video__content">
          <p class="hero-video__eyebrow">OJO Studio</p>
          <h1 class="hero-video__title">Storyfeeling.</h1>
          <a class="hero-video__cta" href="portfolio.html">Ver portfolio</a>
        </div>
        <div class="hero-video__scroll-cue">
          <span>scroll</span>
          <div class="hero-video__scroll-line"></div>
        </div>
      </section>

      <!-- SELECTED WORK -->
      <section class="home-work" id="work">
        <div class="home-work__bar">
          <span class="home-work__label">Selected work</span>
          <a class="home-work__all" href="portfolio.html">Ver todos <span aria-hidden="true">↗</span></a>
        </div>
        <div class="home-work__grid" id="home-projects">
          <!-- placeholders enquanto carrega -->
          <article class="work-card work-card--ph">
            <div class="work-card__img-wrap"><div class="work-card__ph"></div></div>
            <div class="work-card__meta">
              <div class="work-card__ph-line" style="width:40%"></div>
              <div class="work-card__ph-line" style="width:65%;height:20px;margin-top:6px"></div>
            </div>
          </article>
          <article class="work-card work-card--ph work-card--offset">
            <div class="work-card__img-wrap"><div class="work-card__ph"></div></div>
            <div class="work-card__meta">
              <div class="work-card__ph-line" style="width:35%"></div>
              <div class="work-card__ph-line" style="width:55%;height:20px;margin-top:6px"></div>
            </div>
          </article>
        </div>
      </section>

      <!-- SOBRE STRIP -->
      <section class="home-about">
        <div class="home-about__inner">
          <p class="home-about__text">
            Criamos identidades, experiências e histórias para marcas que querem ser sentidas.
          </p>
          <a class="home-about__link" href="sobre.html">Sobre a OJO <span aria-hidden="true">↗</span></a>
        </div>
      </section>

    </main>

    <footer class="footer-home">
      <div class="footer-home__inner">
        <div class="footer-home__logo">OJO</div>
        <nav class="footer-home__nav">
          <a href="portfolio.html">Portfolio</a>
          <a href="sobre.html">Sobre</a>
          <a href="contato.html">Contato</a>
          <a href="https://instagram.com/ojostudio" target="_blank" rel="noopener">Instagram</a>
        </nav>
        <p class="footer-home__copy">© 2024 OJO Studio</p>
      </div>
    </footer>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module">
    import { getFeaturedProjects, getProjects } from './assets/js/modules/portfolio.js'
    import { initScrollNav, initTheme, setLang as _setLang, getLang } from './assets/js/modules/ui.js'

    initTheme()
    initScrollNav()

    document.getElementById('nav-toggle').addEventListener('click', () => {
      document.getElementById('nav').classList.toggle('nav--open')
    })

    window.setLang = _setLang
    const lang = getLang()
    document.documentElement.lang = lang
    document.querySelectorAll('.nav__lang-btn').forEach((btn, i) => {
      btn.classList.toggle('nav__lang-btn--active', (i===0&&lang==='pt')||(i===1&&lang==='en'))
    })

    // Carrega projetos em destaque (fallback para qualquer publicado)
    try {
      let projects = await getFeaturedProjects(2, lang)
      if (!projects.length) {
        const all = await getProjects({ publishedOnly: true, locale: lang })
        projects = all.slice(0, 2)
      }
      const grid = document.getElementById('home-projects')
      if (!projects.length) return

      grid.innerHTML = projects.map((p, i) => `
        <article class="work-card${i===1?' work-card--offset':''}">
          <a class="work-card__img-wrap" href="portfolio/${p.slug}.html">
            ${p.cover_image
              ? `<img class="work-card__img" src="${p.cover_image}" alt="${p.title}" loading="lazy">`
              : `<div class="work-card__img-fallback">${p.title}</div>`}
            <div class="work-card__hover">
              <span class="work-card__view">Ver projeto</span>
            </div>
          </a>
          <div class="work-card__meta">
            <span class="work-card__cat">${Array.isArray(p.category)?p.category[0]:p.category??''}</span>
            <a class="work-card__title" href="portfolio/${p.slug}.html">${p.title}</a>
            <span class="work-card__client">${p.client??''}</span>
          </div>
        </article>
      `).join('')
    } catch(e) { console.error(e) }
  </script>

</body>
</html>
