<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — OJO Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="sidebar">
    <div class="admin-sidebar__header">
      <a class="admin-sidebar__logo" href="/admin/index.html">OJO</a>
      <span class="admin-sidebar__label">Admin</span>
    </div>

    <nav class="admin-nav">
      <a class="admin-nav__item admin-nav__item--active" href="/admin/index.html">
        <svg class="admin-nav__icon" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        Dashboard
      </a>
      <a class="admin-nav__item" href="/admin/portfolio.html">
        <svg class="admin-nav__icon" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="3" width="16" height="11" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M7 17h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M10 14v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Portfolio
      </a>
      <a class="admin-nav__item" href="/admin/mensagens.html">
        <svg class="admin-nav__icon" viewBox="0 0 20 20" fill="none">
          <path d="M3 4h14a1 1 0 011 1v8a1 1 0 01-1 1H5l-3 3V5a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        Mensagens
        <span class="badge badge--primary admin-nav__badge" id="msg-badge" hidden>0</span>
      </a>
    </nav>

    <div class="admin-sidebar__footer">
      <a class="admin-nav__item" href="/" target="_blank">
        <svg class="admin-nav__icon" viewBox="0 0 20 20" fill="none">
          <path d="M10 3H4a1 1 0 00-1 1v12a1 1 0 001 1h12a1 1 0 001-1v-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M13 3h4m0 0v4m0-4L9 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Ver site
      </a>
      <button class="admin-nav__item" id="logout-btn">
        <svg class="admin-nav__icon" viewBox="0 0 20 20" fill="none">
          <path d="M7 17H4a1 1 0 01-1-1V4a1 1 0 011-1h3M13 14l3-4-3-4M16 10H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Sair
      </button>
    </div>
  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <div class="admin-main">

    <!-- TOP BAR -->
    <header class="admin-topbar">
      <button class="admin-topbar__menu-btn" id="sidebar-toggle" aria-label="Menu">
        <svg viewBox="0 0 20 20" fill="none" width="18" height="18">
          <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <h1 class="admin-topbar__title">Dashboard</h1>
      <div class="admin-topbar__user" id="topbar-user"></div>
    </header>

    <!-- CONTEÚDO -->
    <div class="admin-content">

      <!-- STATS -->
      <div class="admin-stats" id="stats">
        <div class="admin-stat">
          <span class="admin-stat__label">Projetos publicados</span>
          <span class="admin-stat__value" id="stat-published">—</span>
        </div>
        <div class="admin-stat">
          <span class="admin-stat__label">Em rascunho</span>
          <span class="admin-stat__value" id="stat-draft">—</span>
        </div>
        <div class="admin-stat">
          <span class="admin-stat__label">Em destaque</span>
          <span class="admin-stat__value" id="stat-featured">—</span>
        </div>
        <div class="admin-stat">
          <span class="admin-stat__label">Mensagens novas</span>
          <span class="admin-stat__value" id="stat-messages">—</span>
        </div>
      </div>

      <!-- AÇÕES RÁPIDAS -->
      <div class="admin-section">
        <h2 class="admin-section__title">Ações rápidas</h2>
        <div class="admin-quick-actions">
          <a class="btn btn--primary" href="/admin/portfolio.html?action=new">
            + Novo projeto
          </a>
          <a class="btn btn--secondary" href="/admin/portfolio.html">
            Gerenciar portfolio
          </a>
          <a class="btn btn--secondary" href="/admin/mensagens.html">
            Ver mensagens
          </a>
        </div>
      </div>

      <!-- PROJETOS RECENTES -->
      <div class="admin-section">
        <div class="admin-section__header">
          <h2 class="admin-section__title">Projetos recentes</h2>
          <a class="btn btn--ghost btn--sm" href="/admin/portfolio.html">Ver todos</a>
        </div>
        <table class="admin-table" id="recent-table">
          <thead>
            <tr>
              <th>Projeto</th>
              <th>Cliente</th>
              <th>Status</th>
              <th>Ano</th>
            </tr>
          </thead>
          <tbody id="recent-tbody">
            <tr><td colspan="4" style="color: var(--color-muted); text-align: center; padding: var(--space-8)">Carregando...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <style>
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }

    .admin-stat {
      background: var(--color-bg-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: var(--space-5) var(--space-6);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .admin-stat__label {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-muted);
      letter-spacing: 0.06em;
    }

    .admin-stat__value {
      font-family: var(--font-display);
      font-size: var(--text-4xl);
      line-height: 1;
    }

    .admin-section {
      margin-bottom: var(--space-10);
    }

    .admin-section__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-4);
    }

    .admin-section__title {
      font-size: var(--text-base);
      font-weight: 500;
    }

    .admin-quick-actions {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    @media (max-width: 1024px) {
      .admin-stats { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      .admin-stats { grid-template-columns: 1fr; }
    }
  </style>

  <script type="module">
    import { requireAuth, signOut, getUser } from '../assets/js/modules/auth.js'
    import { getProjects } from '../assets/js/modules/portfolio.js'
    import { showToast, initTheme } from '../assets/js/modules/ui.js'
    import supabase from '../assets/js/config/supabase.js'

    initTheme()

    // Protege a página
    await requireAuth('/admin/login.html')

    // Usuário logado
    const user = await getUser()
    if (user) {
      document.getElementById('topbar-user').textContent = user.email
    }

    // Sidebar toggle (mobile)
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('admin-sidebar--open')
    })

    // Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut()
      window.location.href = '/admin/login.html'
    })

    // Carrega stats
    try {
      const projects = await getProjects({ publishedOnly: false })
      const published = projects.filter(p => p.published)
      const draft     = projects.filter(p => !p.published)
      const featured  = projects.filter(p => p.featured && p.published)

      document.getElementById('stat-published').textContent = published.length
      document.getElementById('stat-draft').textContent     = draft.length
      document.getElementById('stat-featured').textContent  = featured.length

      // Recentes
      const recent = projects.slice(0, 5)
      document.getElementById('recent-tbody').innerHTML = recent.length
        ? recent.map(p => `
            <tr>
              <td><a href="/admin/portfolio.html?edit=${p.id}" style="color: var(--color-fg)">${p.title}</a></td>
              <td style="color: var(--color-muted)">${p.client ?? '—'}</td>
              <td>
                <span class="badge ${p.published ? 'badge--success' : 'badge--warning'}">
                  ${p.published ? 'Publicado' : 'Rascunho'}
                </span>
              </td>
              <td style="color: var(--color-muted)">${p.year ?? '—'}</td>
            </tr>
          `).join('')
        : `<tr><td colspan="4" style="color: var(--color-muted); text-align: center; padding: var(--space-8)">Nenhum projeto.</td></tr>`

    } catch (err) {
      console.error(err)
    }

    // Conta mensagens não lidas
    try {
      const { count } = await supabase
        .from('contact_messages')
        .select('id', { count: 'exact', head: true })
        .eq('read', false)

      document.getElementById('stat-messages').textContent = count ?? 0
      if (count > 0) {
        const badge = document.getElementById('msg-badge')
        badge.textContent = count
        badge.hidden = false
      }
    } catch (_) {}
  </script>

</body>
</html>
